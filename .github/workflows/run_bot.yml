name: Upbit Signal Bot

on:
  schedule:
    - cron: '0 * * * *'  # 1시간마다 실행 (원하시는 주기로 변경 가능)
  workflow_dispatch:

permissions:
  contents: write  # GitHub Actions가 저장소에 캐시 파일을 커밋/푸시할 수 있도록 권한 부여

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests numpy

      - name: Run Bot Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit and push cache changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tracked_coins.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update tracked_coins cache [skip ci]" && git push)
