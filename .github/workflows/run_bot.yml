name: Coin Signal Bot  # 이 부분을 원하는 이름으로 수정하세요!

on:
  schedule:
    - cron: '*/15 * * * *'  # 15분마다 실행 설정
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install requests numpy
      - name: Run script
        run: |
          python main.py
