name: Upbit Signal Bot

on:
  schedule:
    - cron: '*/30 * * * *'  # 30분마다 자동 실행 (월 사용량 ~1,440분으로 안전)
  workflow_dispatch:

permissions:
  contents: write  # GitHub Actions가 캐시(tracked_coins.json)를 커밋/푸시할 수 있는 권한

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests numpy

      - name: Run Bot Script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit and push cache changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tracked_coins.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update tracked_coins cache [skip ci]" && git push)
