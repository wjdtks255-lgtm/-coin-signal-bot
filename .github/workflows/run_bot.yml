name: Run Crypto Bot

on:
  workflow_dispatch:  # 깃허브 웹에서 수동으로 즉시 실행할 수 있게 해줍니다
  schedule:
    - cron: '0 * * * *'  # 매시간 정각마다 자동으로 실행됩니다 (UTC 기준이므로 한국 시간과는 차이가 있을 수 있습니다)

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run bot script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py
