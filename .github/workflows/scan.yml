name: Gold Futures Smart Signal Bot

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: gold-futures-smart-bot
  cancel-in-progress: false

jobs:

  run-bot:

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================
      # PYTHON
      # ==========================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ==========================================
      # INSTALL
      # ==========================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ==========================================
      # RUN BOT
      # ==========================================

      - name: Run Gold Futures Smart Signal Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot.py

      # ==========================================
      # SAVE STATE
      # ==========================================

      - name: Save bot state and logs
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add signal_state.json bot_log.json

          if git diff --cached --quiet; then

            echo "No state or log changes."

          else

            git commit -m "Update gold bot state and logs"

            git push

          fi
