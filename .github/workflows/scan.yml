name: Upbit Spot Profit Tracking Bot

on:
  schedule:
    - cron: '*/15 * * * *' # 15분마다 실행 (원하시는 주기로 변경 가능)
  workflow_dispatch: # GitHub 웹에서 수동 실행 버튼 제공

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 💡 봇 실행 후 상태 파일 자동 커밋을 위해 필수

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py  # 💡 main.py 실행

      # 💡 포지션 상태 파일 변경분을 리포지토리에 자동 저장
      - name: Save State and Commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto update bot state [skip ci]"
          file_pattern: bot_state.json
