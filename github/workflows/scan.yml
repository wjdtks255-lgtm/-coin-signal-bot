name: Upbit Spot Profit Tracking Bot

on:
  workflow_dispatch: {}

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: upbit-profit-tracking
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy

      - name: Run Upbit Signal Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      - name: Save tracking state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add tracked_coins.json || true

          if git diff --cached --quiet; then
            echo "No tracking state changes."
          else
            git commit -m "Update tracking state"
            git push
          fi
