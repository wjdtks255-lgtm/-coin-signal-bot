name: Upbit Spot Signal Bot

on:

  # 한국시간 매 15분 실행
  schedule:
    - cron: "*/15 * * * *"

  # GitHub Actions 화면에서 수동 실행 가능
  workflow_dispatch:


permissions:
  contents: write


jobs:

  scan:

    runs-on: ubuntu-latest

    timeout-minutes: 10


    steps:

      # ------------------------------------------------------
      # Repository
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

        with:
          fetch-depth: 0


      # ------------------------------------------------------
      # Python
      # ------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"
          cache: "pip"


      # ------------------------------------------------------
      # Dependencies
      # ------------------------------------------------------

      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          pip install \
            requests \
            numpy


      # ------------------------------------------------------
      # Run Bot
      # ------------------------------------------------------

      - name: Run Upbit Signal Bot
        env:

          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |

          python bot.py


      # ------------------------------------------------------
      # Save signal cache
      # ------------------------------------------------------

      - name: Commit bot state
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add tracked_coins.json

          git diff --cached --quiet || git commit -m "Update signal bot state"

          git push
